version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - nilnil
    - nilerr
    - errorlint
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # blittable structs mirror C layout, fields can't be reordered
        - shadow
  exclusions:
    generated: lax
    paths:
      - .claude
    presets:
      - std-error-handling

formatters:
  enable:
    - gofumpt
  exclusions:
    paths:
      - .claude

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
