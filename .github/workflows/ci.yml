name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check go.mod is tidy
        if: matrix.os == 'ubuntu-latest'
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      # The race detector runs on Linux only: elsewhere it needs a C toolchain.
      # Tests that need a memory dump skip themselves here.
      - name: Test (race, coverage)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -race -shuffle=on -count=1 -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -1

      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: go test -count=1 ./...
